<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container border mt-5">
      <div class="row text-center bg-black text-white">
        <div class="col-6">
          <div class="row">
            <div class="col fw-bold-p-2">Enero</div>
            <div class="row">
              <div class="col-3 border border-light">Semana 1</div>
              <div class="col-3 border border-light">Semana 2</div>
              <div class="col-3 border border-light">Semana 3</div>
              <div class="col-3 border border-light">Semana 4</div>
            </div>
          </div>
        </div>

        <div class="col-6">
          <div class="row">
            <div class="col fw-bold-p-2">Febrero</div>
            <div class="row">
              <div class="col-3 border border-light">Semana 1</div>
              <div class="col-3 border border-light">Semana 2</div>
              <div class="col-3 border border-light">Semana 3</div>
              <div class="col-3 border border-light">Semana 4</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row p-4">
        <div class="row py-2">
          <div class="item col-5 rounded-2 bg-secondary text-white p-2">
            <div class="row">
              <div class="col-10">
                <div class="status fs-6 text-info">Completada</div>
                <div class="title fw-bold fs-5">Definir arquitectura</div>
                <div class="date opacity-50 fs-6">20 de Enero</div>
              </div>
              <div class="col-2 d-flex align-items-center gap-1 p-1">
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row p-4">
        <div class="row py-2">
          <div class="col-3"></div>
          <div class="item col-5 rounded-2 bg-secondary text-white p-2">
            <div class="row">
              <div class="col-10">
                <div class="status fs-6 text-warning">En progreso</div>
                <div class="title fw-bold fs-5">Definir arquitectura</div>
                <div class="date opacity-50 fs-6">20 de Enero</div>
              </div>
              <div class="col-2 d-flex align-items-center gap-1 p-1">
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row p-4">
        <div class="row py-2">
          <div class="col-4"></div>
          <div class="item col-5 rounded-2 bg-secondary text-white p-2">
            <div class="row">
              <div class="col-10">
                <div class="status fs-6 text-danger">Bloqueada</div>
                <div class="title fw-bold fs-5">Definir arquitectura</div>
                <div class="date opacity-50 fs-6">20 de Enero</div>
              </div>
              <div class="col-2 d-flex align-items-center gap-1 p-1">
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
                <img
                  src="../Ejercicios-CSS/imagenes/icono_usuario.jpg"
                  alt=""
                  class="rounded-circle border"
                  width="32"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
