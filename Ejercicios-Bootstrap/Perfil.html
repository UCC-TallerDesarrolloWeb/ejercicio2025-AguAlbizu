<!DOCTYPE html>
<html lang="en">
  <head>

    <style>
      .card {

      .profile {

  <body>
    <div class="d-flex justify-content-center my-5">

        <div class="list-group list-gorup-flush">
          <a
            href=""
            class="list-group-item list-group-item-action d-flex gap-2 align-items-center"
            ><span class="material-symbols-outlined"> notifications </span> Ir a
            mensajes</a
          >
          <a

            ><span class="material-symbols-outlined"> comment </span>
            Notificaciones

          <a
